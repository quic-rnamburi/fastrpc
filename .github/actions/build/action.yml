name: Build workspace
description: |
  Builds and packages the FastRPC workspace.
  This composite action compiles the FastRPC source code and kernel modules
  using a specified Docker image, verifies the compilation artifacts, and
  then packages the resulting binaries, libraries, and kernel modules
  into a gzipped CPIO ramdisk. It also includes steps to copy
  firmware files and test binaries into the ramdisk.
  Finally, it unpacks the generated ramdisk for inspection and verification.

inputs:
  docker_image:
    description: Docker image
    required: true
    default: fastrpc-image:latest
  workspace_path:
    description: Workspace path
    required: true

runs:
  using: "composite"
  steps:
    - name: Compile fastrpc code using Docker Image
      shell: bash
      run: |
        cd ${{ inputs.workspace_path }}
        echo "::group::$(printf '__________ %-100s' 'Compile fastrpc' | tr ' ' _)"
        docker run -i --rm \
        --user $(id -u):$(id -g) \
        --workdir="$PWD" \
        -v "$(dirname $PWD)":"$(dirname $PWD)" \
        ${{ inputs.docker_image }} bash -c "
          chmod +x gitcompile
          ./gitcompile --host=aarch64-linux-gnu
          make install DESTDIR=${{ inputs.workspace_path }}/artifacts/ramdisk_staging_dir
        "
        echo "::endgroup::"

    - name: Copy FastRPC firmware into ramdisk staging
      shell: bash
      working-directory: ${{ inputs.workspace_path }}
      run: |
        echo "Copying FastRPC firmware into ramdisk staging directory"
        # Copy firmware from firmware_dir into the ramdisk staging area
        cp -a firmware_dir/. artifacts/ramdisk_staging_dir/

    - name: Download Kernel artifact
      uses: actions/download-artifact@v4
      with:
        name: kobj-artifact
        path: downloaded_kobj # This path is relative to ${{ github.workspace }}

    - name: Unzip DLKM, Copy to Ramdisk Staging, and Final Repack
      shell: bash
      # This step needs to operate on both downloaded_kobj (in github.workspace) and workspace_path
      # Setting working-directory to github.workspace and using explicit paths is safer.
      working-directory: ${{ github.workspace }}
      run: |
        echo "Unzipping kobj.zip"
        unzip downloaded_kobj/kobj.zip -d extracted_kobj
        echo "Contents of extracted_kobj:"
        find extracted_kobj -type d

        echo "Copying DLKM into ramdisk staging directory"
        # Define the absolute path to the ramdisk staging directory for clarity
        RAMDISK_STAGING_DIR="${{ inputs.workspace_path }}/artifacts/ramdisk_staging_dir"

        # Ensure the target directory for modules exists within the staging area
        mkdir -p "${RAMDISK_STAGING_DIR}/lib/modules"
        # Copy DLKM (kernel modules) into the ramdisk staging area
        cp -a extracted_kobj/kobj/tar-install/lib/modules/. "${RAMDISK_STAGING_DIR}/lib/modules/"

        echo "Repackaging ramdisk from staging directory"
        # Navigate to the ramdisk staging directory to create the new cpio archive
        # Output the new cpio to the artifacts directory
        (cd "${RAMDISK_STAGING_DIR}" && find . | cpio -o -H newc > "${{ inputs.workspace_path }}/artifacts/new_ramdisk.cpio")

        # Navigate back to the artifacts directory to gzip and rename the new ramdisk
        cd "${{ inputs.workspace_path }}/artifacts"
        gzip -9 new_ramdisk.cpio
        mv new_ramdisk.cpio.gz ramdisk.gz
        echo "Final ramdisk.gz created."

    - name: Unpack and inspect ramdisk
      shell: bash
      working-directory: ${{ inputs.workspace_path }}/artifacts # Operate within the artifacts directory
      run: |
        echo "Unpack and inspect final ramdisk"
        # Decompress the final ramdisk.gz safely
        gunzip -c ramdisk.gz > ramdisk.cpio

        # Check the format of the ramdisk (useful for debugging)
        file ramdisk.cpio

        # Create a dedicated directory to unpack into, to keep current directory clean
        mkdir -p final_ramdisk_contents
        echo "Unpacking ramdisk.cpio into final_ramdisk_contents/"
        (cd final_ramdisk_contents && cpio -idmv < ../ramdisk.cpio)

        # Inspect contents within the unpacked directory
        echo "Inspecting final_ramdisk_contents/usr/lib:"
        ls -ltr final_ramdisk_contents/usr/lib | grep rpc || true
        echo "Inspecting final_ramdisk_contents/usr/bin:"
        ls -ltr final_ramdisk_contents/usr/bin | grep rpc || true
