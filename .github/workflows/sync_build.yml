name: Sync and build
description: |
  This reusable workflow syncs and builds FastRPC code for a specified machine and firmware 
  using a Docker image. It performs code checkout, Docker image build, workspace sync, 
  kernel compilation, and artifact packaging. Key build outputs (Image, ramdisk, modules, DTB) 
  are uploaded to S3, and the runner workspace is cleaned to manage disk usage. A summary of 
  the build status is added to the GitHub Actions summary.

on:
  workflow_call:
    inputs:
      docker_image:
        description: Docker image
        type: string
        required: true
      machine:
        description: Target machine name
        type: string
        required: true
      firmware:
        description: Firmware identifier
        type: string
        required: true

jobs:
  build:
    runs-on:
      group: GHA-FastRPC-Stg-SelfHosted-RG
      labels: [ self-hosted, fastrpc-stg-u2404-x64-large-od-ephem ] 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # fetch-depth: 1 is generally sufficient for builds and is faster than 0 (full history).
          # Change to 0 if your build process strictly requires the full Git history.
          fetch-depth: 1

      - name: Build fastrpc docker image
        uses: qualcomm-linux-stg/fastrpc/.github/actions/build_docker_image@Nightly-build
        with:
          image: ${{ inputs.docker_image }}

      - name: Sync codebase
        id: sync
        uses: qualcomm-linux-stg/fastrpc/.github/actions/sync@Nightly-build
        with:
          machine: ${{ inputs.machine }}
          firmware: ${{ inputs.firmware }}

      - name: Build workspace
        id: build_workspace
        uses: qualcomm-linux-stg/fastrpc/.github/actions/build@Nightly-build
        with:
          docker_image: ${{ inputs.docker_image }}
          workspace_path: ${{ steps.sync.outputs.workspace_path }}

      - name: Create file list for artifacts upload
        run: |
          set -eo pipefail # Exit immediately if a command exits with a non-zero status, and treat pipes as failing if any command in the pipe fails.
          workspace="${{ steps.sync.outputs.workspace_path }}"
          artifacts_dir="$workspace/artifacts"
          extracted_kobj_dir="$workspace/extracted_kobj/kobj"
          tar_install_dir="$extracted_kobj_dir/tar-install"

          # Use a temporary file for the list to ensure atomicity before moving it to its final destination.
          file_list_temp=$(mktemp "$artifacts_dir/file_list_XXXX.txt")

          modules_tar_path="${{ github.workspace }}/modules.tar.xz" # Path where modules.tar.xz will be created.
          if [ -d "$tar_install_dir/lib/modules" ]; then
            # Navigate into tar_install_dir to create the tarball with relative paths inside.
            # -cJf: create, use XZ compression, specify filename.
            (cd "$tar_install_dir" && tar -cJf "$modules_tar_path" lib/modules/)
            echo "Created $modules_tar_path"
          else
            echo "Warning: $tar_install_dir/lib/modules not found, skipping modules.tar.xz creation." >&2
            # Clear the path if the tarball was not created, so it's not added to the list.
            modules_tar_path="" 
          fi

          # Add files to the temporary list.
          # Conditionally add modules.tar.xz if it was successfully created.
          [ -n "$modules_tar_path" ] && echo "$modules_tar_path" >> "$file_list_temp"
          
          # Add other required build artifacts.
          echo "$extracted_kobj_dir/arch/arm64/boot/Image" >> "$file_list_temp"
          echo "$extracted_kobj_dir/vmlinux" >> "$file_list_temp"
          echo "$artifacts_dir/ramdisk.gz" >> "$file_list_temp"
          echo "$extracted_kobj_dir/arch/arm64/boot/dts/qcom/${{ inputs.machine }}.dtb" >> "$file_list_temp"

          # Move the temporary file to its final destination.
          mv "$file_list_temp" "$artifacts_dir/file_list.txt"

          echo "Artifacts directory contents after file list creation:"
          ls -la "$artifacts_dir"
          echo "Artifacts file_list.txt contents:"
          cat "$artifacts_dir/file_list.txt"


      - name: Upload artifacts
        uses: qualcomm-linux-stg/fastrpc/.github/actions/aws_s3_helper@Nightly-build
        with:
          s3_bucket: qli-stg-fastrpc-gh-artifacts
          # local_file points to the list of files to upload
          local_file: ${{ steps.sync.outputs.workspace_path }}/artifacts/file_list.txt
          mode: multi-upload
          machine: ${{ inputs.machine }}

      - name: Clean up
        shell: bash
        run: |
          set -eo pipefail # Ensure robustness for cleanup operations.
          workspace="${{ steps.sync.outputs.workspace_path }}"

          echo "Starting cleanup..."
          # Remove specific directories/files.
          # The `|| true` prevents the step from failing if a path doesn't exist,
          # which is useful for idempotent cleanup.

          # These directories are commonly extracted directly into the GITHUB_WORKSPACE.
          rm -rf fastrpc_libs || true 
          rm -rf gcc-linaro-7.5.0-2019.12-i686_aarch64-linux-gnu || true

          # These directories are created within the dynamically determined 'workspace' path.
          rm -rf "$workspace/artifacts" || true # Clean the artifacts directory itself.
          rm -rf "$workspace/extracted_kobj/" || true

          # This file was explicitly created at the GITHUB_WORKSPACE root.
          rm -rf "${{ github.workspace }}/modules.tar.xz" || true 

          echo "Cleanup complete."

      - name: Update summary
        # This step always runs to provide feedback on the build status.
        if: success() || failure()
        shell: bash
        run: |
          if [ "${{ steps.build_workspace.outcome }}" == 'success' ]; then
            echo "Build was successful"
            summary=":heavy_check_mark: Build Success"
          else
            echo "Build failed"
            summary=":x: Build Failed"
          fi
          SUMMARY='
          <details><summary><i>Build Summary</i></summary>
          '${summary}'
          </details>
          '
          echo -e "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
